# HoneyNet Live — local + Always Free VM stack
# Designed for ~1.5–3 GB RAM. Elasticsearch and Kafka are intentionally absent.
#
# Networks:
#   edge      — nginx only (public HTTP)
#   app       — backend, frontend, redis (never published)
#   honeypot  — cowrie + backend collector (cowrie cannot reach redis)

name: honeynet-live

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    networks: [app]
    mem_limit: 80m
    cpus: 0.25
    pids_limit: 64
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: sqlite:////data/honeynet.db
      REDIS_URL: redis://redis:6379/0
      COWRIE_JSON_LOG: /cowrie-var/log/cowrie/cowrie.json
      COWRIE_DOWNLOADS_DIR: /cowrie-var/lib/cowrie/downloads
    volumes:
      - honeynet-data:/data
      - cowrie-var:/cowrie-var:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [app, honeypot]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [app]
    mem_limit: 32m
    cpus: 0.10
    pids_limit: 32
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    networks: [edge, app]
    mem_limit: 48m
    cpus: 0.20
    pids_limit: 64
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run", "/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 20s
      timeout: 3s
      retries: 5

  cowrie:
    image: cowrie/cowrie:2.5.0
    profiles: ["live"]
    user: "1000:1000"
    ports:
      - "2222:2222"
      - "2223:2223"
    volumes:
      - ./honeypot/cowrie/etc/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./honeypot/cowrie/etc/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - cowrie-var:/cowrie/cowrie-git/var
    restart: unless-stopped
    networks: [honeypot]
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp", "/cowrie/cowrie-git/var/run"]
    extra_hosts:
      - "169.254.169.254:127.0.0.1"
      - "169.254.169.253:127.0.0.1"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket;s=socket.socket();s.settimeout(2);s.connect(('127.0.0.1',2222));s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  honeynet-data:
  cowrie-var:

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
    internal: false
  honeypot:
    driver: bridge
    # Cowrie still needs inbound from the internet via published ports.
    # It must not reach Redis, the dashboard, or cloud metadata.
    internal: false
