# Cowrie configuration for HoneyNet Live
# Attackers see a fake Unix environment. Nothing here is a real host account.

[honeypot]
hostname = web-prod-01
sensor = honeynet-live
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
state_path = var/lib/cowrie
etc_path = etc
contents_path = share/cowrie/honeyfs
txtcmds_path = share/cowrie/txtcmds
ttylog = true
ttylog_path = var/lib/cowrie/tty
interactive_timeout = 180
authentication_timeout = 120
backend = json
timezone = UTC

[ssh]
enabled = true
rsa_public_key = var/lib/cowrie/ssh_host_rsa_key.pub
rsa_private_key = var/lib/cowrie/ssh_host_rsa_key
version = SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.11
listen_endpoints = tcp:2222:interface=0.0.0.0
sftp_enabled = false
forwarding = false
forward_redirect = false
auth_none_enabled = false

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false

[output_textlog]
enabled = false

# Do not let Cowrie act as a jump host.
[proxy]
enabled = false

[shell]
# Fake filesystem / mock commands only
filesystem = share/cowrie/fs.pickle
processes = share/cowrie/cmdoutput.json
arch = linux-x64-lsb

[downloaded_command]
# Record wget/curl metadata; do not execute payloads
enabled = false
